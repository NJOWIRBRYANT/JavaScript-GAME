<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guess the Number!</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background: #f0f8ff; }
        input { padding: 8px; font-size: 16px; width: 60px; text-align: center; }
        button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
        p { font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h1> GUESS A NUMBER AND WIN A $ </h1>
    <p>I am thinking of a number from 1 to 10.</p>
    
    <input type="number" id="guessInput" min="1" max="100">
    <button onclick="checkGuess()">Guess!</button>
    
    <p id="message"></p>

    <script>
        // Pick a random number between 1 and 10
        let secretNumber = Math.floor(Math.random() * 10) + 1;

        function checkGuess() {
            let userGuess = Number(document.getElementById("guessInput").value);
            let message = document.getElementById("message");

            if (userGuess === secretNumber) {
                message.style.color = "green";
                message.innerText = " Correct! CONGRATULATIONS!";
            } else if (userGuess < secretNumber) {
                message.style.color = "green";
                message.innerText = " You made it! Make more money.";
            } else {
                message.style.color = "red";
                message.innerText = " You failed! Try again good luck.";
            }
        }
    </script>

</body>
</html>
